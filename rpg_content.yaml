schema_version: 1
notes:
- Custom seed-data YAML, not Django loaddata fixture format.
- Items model values are stored in item.Item polymorphic subclasses.
- Encounter keys must be registered in hero.encounters.ENCOUNTER_DEFINITIONS before creating EncounterMonster rows.
- All encounter groups have at most three monsters; each spawn quantity is 1-3.
- Elemental resistance values are damage multipliers (0.80 means 20% reduction).
- Damage, skill effects, and difficulty require playtesting against your battle engine.
- 'Coin denominations: Copper Coin = 1 money, Silver Coin = 10 money, Gold Coin = 100 money; Instant items automatically
  credit money on receipt.'
- Coin loot is guaranteed on every monster defeat; quantity scales with level and threat. No goblin monster exists
  in the supplied roster.
- hero_class_restriction is a HeroClass lookup by key; null means unrestricted.
- initial_equipment is seed metadata, not a HeroClass model field. Apply it during hero creation by creating Equipment
  and EquipmentSlot records.
- 'Weapon magic bonuses are not supported by the current Weapon model: wizard staffs give modest ATK and elemental
  damage, while wizard accessories give MAG.'
- Accessory passive_effects and armor health_bonus require combat-engine support to have an effect.
- Equipment drop chances are independent rolls; original loot, coins, monsters and encounters are preserved.
